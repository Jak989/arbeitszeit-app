<?xml version="1.0" encoding="UTF-8"?>
<!--
  App-Icon "Arbeitszeit"
  Motiv: Uhr (Arbeitszeit) — bewusst reduziert, damit es auch bei 48 px lesbar bleibt.
  Stil:  Strichzeichnung, passend zu den Tab-Symbolen der App.
  Farbe: Akzentblau #007aff auf Weiß.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d9bff"/>
      <stop offset="100%" stop-color="#0057bd"/>
    </linearGradient>
  </defs>

  <!-- Hintergrund -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Uhr: kräftiger Kreis -->
  <circle cx="256" cy="256" r="150"
          fill="none" stroke="#ffffff" stroke-width="40"
          stroke-linecap="round"/>

  <!-- Zeiger: 15 Minuten nach voll (deutlich, dick) -->
  <path d="M256 256 L256 160"
        fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round"/>
  <path d="M256 256 L330 256"
        fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round"/>

  <!-- Mittelpunkt -->
  <circle cx="256" cy="256" r="20" fill="#ffffff"/>
</svg>
